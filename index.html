<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#1F2240" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<title>아이결 기질검사</title>
<meta name="description" content="만 2~7세 아이의 타고난 결을 네 글자로 읽는 부모용 기질검사 시제품">

<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Art concept C4 "색연필·크레용": warm cream paper, sky blue, pink, leaf green; Gaegu handwritten headings; soft hand-drawn edges; Higgsfield crayon characters. Layout: one narrow phone-first column. */
:root{
  --hero:url(assets/key_home.webp); --paper:url(assets/paper_tile.webp); --head-eb:#8CC4EA;
  --bg:#FBF5EA; --surface:#FFFDF8; --sunk:#F5EDE0; --line:#E2D4BF;
  --fg:#36405A; --muted:#656C80; --accent:#8CC4EA; --accent-ink:#2D6C98; --on-accent:#1F2E45;
  --c1:#DD7356; --c2:#3A9586; --c3:#CF6189; --c4:#4C7CC0; --g:#6A9F45;
  --band:#EFE4D2;
  --display:"Gaegu","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;color:var(--fg);text-decoration:none}
.brand small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{font-size:13px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:999px}
nav a.on{background:var(--fg);color:var(--bg)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:28px} h2{font-size:21px} h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--accent-ink);font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;background:var(--accent);color:var(--on-accent);text-align:center;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.dark{background:var(--fg);color:var(--bg)}
.btn:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--c4);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 180px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.plan{position:relative}
.plan ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--fg);border:1px solid var(--line)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);width:100%}
/* test */
.prog{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.qtext{font-family:var(--display);font-size:22px;line-height:1.5;text-wrap:balance}
.exq{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted);min-height:3.6em}
.exq b{color:var(--accent-ink);margin-right:6px;font-size:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:flex;gap:12px;align-items:center}
.opt b{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.passbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;background:var(--sunk);border-radius:12px;padding:10px 14px;font-size:13px}
.passbar b{font-variant-numeric:tabular-nums}
.price{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.1}
.price small{font-family:var(--body);font-size:14px;font-weight:400;color:var(--muted);margin-left:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
textarea{font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);width:100%;min-height:92px;resize:vertical}
.ans{display:flex;flex-direction:column;gap:12px}
.ans .lab{font-size:12px;font-weight:700;color:var(--accent-ink);letter-spacing:.04em}
.bubble{align-self:flex-end;background:var(--fg);color:var(--bg);border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:90%}
.help{border:2px solid var(--c3);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.opt.unk{border-style:dashed;background:transparent;margin-top:6px}
.opt.sel{border-color:var(--accent);background:var(--sunk)} .opt.sel b{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
/* report */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sheet-head{background:var(--fg);color:var(--bg);padding:18px;display:flex;flex-direction:column;gap:4px}
.sheet-head .eyebrow{color:var(--head-eb)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border-top:1px solid var(--line)}
.meta div{padding:10px 18px;border-bottom:1px solid var(--line);font-size:13px}
.meta span{display:block;color:var(--muted);font-size:12px}
.type{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.code{font-family:var(--display);font-weight:700;font-size:54px;letter-spacing:.12em;line-height:1;display:flex}
.code span{display:inline-block}
.bar{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center;font-size:13px}
.bar .l{text-align:right} .bar .on{font-weight:700}
.track{position:relative;height:14px;background:var(--sunk);border-radius:99px}
.track .mid{position:absolute;left:40%;width:20%;top:0;bottom:0;background:var(--band)}
.track .fill{position:absolute;top:0;bottom:0;border-radius:99px}
.track .dot{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--surface)}
.track.thin{height:8px} .track.thin .dot{width:14px;height:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:8px;background:var(--band);border-radius:3px;margin-right:5px;vertical-align:middle}
.axis-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:var(--surface)}
.sub{display:flex;flex-direction:column;gap:4px}
.sub .nm{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.sub .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
details{border-top:1px dashed var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;font-size:14px}
details>div{padding-top:10px;display:flex;flex-direction:column;gap:12px}
.say{border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-family:var(--display)}
.avoid{border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.gauge{display:grid;grid-template-columns:92px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.gauge .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.lock{position:relative;border:1px dashed var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.lock h3{font-size:15px;font-family:var(--body);font-weight:700}
.skel{display:flex;flex-direction:column;gap:6px;filter:blur(3px);opacity:.6}
.skel i{display:block;height:9px;border-radius:5px;background:var(--line)}
.note{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:13px}
.cta{background:var(--fg);color:var(--bg);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.cta .muted{color:var(--bg);opacity:.75}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
.tw{overflow-x:auto}
.mk{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
@media (max-width:420px){ h1{font-size:24px} .code{font-size:44px} .qtext{font-size:19px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
/* ---- concept C4: 색연필·크레용 ---- */
h1,h2,h3,.brand,.code,.price,.qtext,.say{font-weight:700}
h1,h2,h3,.qtext,.say{word-break:keep-all} h1{font-size:31px;line-height:1.25} h2{font-size:24px} h3{font-size:19px} .qtext{font-size:25px;line-height:1.4} .say{font-size:19px;line-height:1.45}
html,body{background:var(--bg) var(--paper) repeat;background-size:512px}
.card,.sheet,.lock,.cta,.help{border-radius:24px 20px 26px 19px/20px 25px 19px 24px}
.card,.sheet{border:1.5px solid var(--line);box-shadow:2px 3px 0 color-mix(in srgb,var(--line) 85%,transparent)}
.btn{border-radius:999px 940px 999px 960px/999px 980px 940px 999px;border:1.5px solid color-mix(in srgb,var(--accent-ink) 55%,transparent);box-shadow:1px 3px 0 color-mix(in srgb,var(--accent-ink) 40%,transparent)}
.btn.ghost,.btn.dark{box-shadow:none}
.btn.ghost{border:1.5px solid var(--line)}
.opt{border-radius:20px 17px 21px 18px/18px 21px 17px 20px;border-width:1.5px} .exq,.note,.passbar{border-radius:18px 15px 19px 16px}
input,select,textarea{border-radius:14px;border-width:1.5px}
.brand{display:inline-flex;align-items:center;gap:6px;font-size:24px}
.brand img{width:34px;height:34px;object-fit:contain}
.hero{position:relative;aspect-ratio:4/5;border-radius:26px 22px 28px 21px/22px 27px 21px 26px;overflow:hidden;background:var(--sunk) var(--hero) center 58%/cover;box-shadow:2px 3px 0 var(--line);border:1.5px solid var(--line)}
.hero span{position:absolute;left:14px;top:14px;background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--fg);font-family:var(--display);font-weight:700;font-size:18px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line)}
.banner{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:24px 20px 26px 19px/20px 25px 19px 24px;border:1.5px solid var(--line)}
.sheet .banner{border:0;border-radius:0}
.coach-art{display:block;width:180px;height:180px;object-fit:contain;align-self:center;margin-block:-6px}
.type{position:relative}
.masc{position:absolute;right:8px;top:4px;width:112px;height:112px;object-fit:contain}
.type>p,.type>h1{max-width:100%}
.ttl{display:flex;align-items:center;gap:10px}
.ttl img{width:72px;height:72px;flex:none;object-fit:contain}
.tag.tm{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 6px}.tag.tm img{width:44px;height:44px;object-fit:contain}
.empty-m{width:120px;height:120px;align-self:center;object-fit:contain}
@media (max-width:420px){ .masc{width:92px;height:92px;right:4px} h1{font-size:28px} .code{font-size:46px} .qtext{font-size:22px} }
/* ---- app shell ---- */
body{padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;gap:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg) var(--paper) repeat;background-size:512px;flex-wrap:nowrap;padding-block:10px}
.brand small{display:none}
.hlink{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,480px);z-index:20;display:grid;grid-template-columns:repeat(4,1fr);gap:0;
  background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));box-shadow:0 -6px 18px color-mix(in srgb,var(--fg) 8%,transparent)}
#nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);padding:4px 2px;border-radius:14px;background:none;min-height:52px}
#nav a .ic{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .15s}
#nav a.on{background:none;color:var(--fg);font-weight:700}
#nav a.on .ic{background:var(--accent);color:var(--on-accent)}
body[data-view="test"] #nav,body[data-view="pass"] #nav{display:none}
body[data-view="test"] .hlink{display:none}
#app>*{animation:rise .28s ease both}
@keyframes rise{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.btn{min-height:52px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;transition:transform .08s}
.btn:active,.opt:active,.chip:active{transform:scale(.97)}
.opt{min-height:56px;font-size:16px;transition:transform .08s}
.chip{min-height:40px}
.row>*{flex:1 1 140px}
.two{grid-template-columns:1fr}
input,select,textarea{font-size:16px;min-height:48px}
.qhelp{border-top:0;padding-top:0}.qhelp summary{font-weight:500;font-size:13px;color:var(--muted)}
.testbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,480px);z-index:20;display:flex;gap:10px;background:var(--bg);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.testbar .btn{flex:1}
.stickycta{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));width:min(100%,480px);z-index:19;animation:none!important;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.stickycta .btn{width:100%;box-shadow:0 6px 18px color-mix(in srgb,var(--accent-ink) 35%,transparent)}
body[data-view="quick-result"]{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){ body{background:var(--sunk)} .wrap{background:var(--bg) var(--paper) repeat;background-size:512px;min-height:100vh;padding-inline:20px;box-shadow:0 0 0 1px var(--line)} header.top{margin-inline:-20px;padding-inline:20px} }
@media (prefers-reduced-motion:reduce){ #app>*{animation:none} }
.microw{display:flex;flex-direction:column;align-items:stretch;gap:8px} .mic{justify-content:center}
.mic{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:999px;border:2px solid var(--accent);background:var(--surface);color:var(--fg);font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:transform .08s}
.mic:active{transform:scale(.97)} .mic:disabled{opacity:.5}
.mic.on{background:var(--accent);color:var(--on-accent);animation:micp 1.4s ease-in-out infinite}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
@media (prefers-reduced-motion:reduce){ .mic.on{animation:none} }

/* ---- 손그림 UI (c4_ui, 힉스필드 GPT Image 2.5): 9-slice 테두리 그림, 크레용 막대·점, 손그림 아이콘 ---- */
html,body{background:var(--bg) var(--paper) repeat;background-size:512px}
header.top{border-bottom:0;background:url(assets/ui/d_wave.webp) left bottom/100% 7px no-repeat,var(--bg) var(--paper) repeat;background-size:100% 7px,512px}
/* 카드: 손그림 틀(::before) + 아래에 살짝 비껴 깔린 종이(::after) */
.card,.sheet{position:relative;isolation:isolate;border:0;background:none;box-shadow:none;border-radius:0}
.card::before,.sheet::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border:0 solid transparent;border-image:url(assets/ui/card.webp) 22 fill / 15px / 0 stretch;border-radius:0;box-shadow:none;background:none}
.card::after,.sheet::after{content:"";position:absolute;inset:6px -4px -6px 5px;z-index:-2;pointer-events:none;border:0 solid transparent;border-image:url(assets/ui/box_soft.webp) 27 fill / 14px / 0 stretch;border-radius:0;box-shadow:none;background:none;opacity:.9}
.card:nth-of-type(even)::after{inset:7px 5px -5px -4px}
.card:nth-of-type(3n)::after{inset:5px -3px -7px 2px}
.card.plan[style*="accent"]::before{border-image-source:url(assets/ui/card_blue.webp);border-image-slice:23 fill}
.sheet{padding:12px;overflow:visible}
.sheet .banner{margin:0}
.sheet-head{border:0 solid transparent;border-image:url(assets/ui/box_dark.webp) 30 fill / 14px / 0 stretch;border-radius:0;box-shadow:none;background:none;margin-top:10px;padding:18px 20px;color:var(--bg)}
.meta{border-top:0} .meta div{border-bottom:1px dashed var(--line)}
.cta{border:0 solid transparent;border-image:url(assets/ui/box_dark.webp) 30 fill / 15px / 0 stretch;border-radius:0;box-shadow:none;background:none;padding:24px 22px}
.lock{border:0 solid transparent;border-image:url(assets/ui/box_lock.webp) 23 fill / 13px / 0 stretch;border-radius:0;box-shadow:none;background:none} .lock h3{display:flex;align-items:center;gap:8px} .ico{width:22px;height:22px;flex:none}
.note,.exq,.passbar{border:0 solid transparent;border-image:url(assets/ui/box_soft.webp) 27 fill / 12px / 0 stretch;border-radius:0;box-shadow:none;background:none}
.help{border:0 solid transparent;border-image:url(assets/ui/box_pink.webp) 25 fill / 14px / 0 stretch;border-radius:0;box-shadow:none;background:none}
.bubble{border:0 solid transparent;border-image:url(assets/ui/bubble.webp) 81 fill / 26px / 0 stretch;border-radius:0;box-shadow:none;background:none;color:var(--bg);padding:12px 22px 22px 16px}
/* 버튼 */
.btn{border:0 solid transparent;border-image:url(assets/ui/btn_blue.webp) 60 fill / 26px / 0 stretch;border-radius:0;box-shadow:none;background:none;color:var(--on-accent)}
.btn.ghost{border:0 solid transparent;border-image:url(assets/ui/btn_ghost.webp) 61 fill / 26px / 0 stretch;border-radius:0;box-shadow:none;background:none;color:var(--fg);font-weight:500}
.btn.dark{border:0 solid transparent;border-image:url(assets/ui/btn_dark.webp) 60 fill / 26px / 0 stretch;border-radius:0;box-shadow:none;background:none;color:var(--bg)}
.btn:active,.opt:active,.chip:active{transform:translateY(1px) rotate(-.4deg);filter:brightness(.95)}
.stickycta .btn{box-shadow:none}

    const m0=mean(subs.filter(x=>x!=null)); const sc=m0==null?50:Math.round(m0);

    return {a,subs,sc,letter:sc>=50?a.H:a.L,pole:sc>=50?a.hi:a.lo,clar:d>=20?'뚜렷함':d>=8?'약간':'균형에 가까움',d};

  const gr=GR.map(g=>{ const sc=pct(mean(ITEMS.filter(x=>x.gr===g.id).map(v).filter(x=>x!=null))); return {g,sc,lv:sc==null?null:sc>=65?2:sc>=40?1:0}; });

async function ask(q,preIdx){ const r=score(); cerr='';
  if(preIdx!=null){ const pz=PRE[preIdx], x=r.ax[pz.ax], v=x.sc>=50?pz.H:pz.L, p=P[x.letter];
    conv={q:pz.t,turns:[{q:pz.t,a:{me:'먼저 숨을 한 번 고르고 아이 눈높이로 내려가 주세요.',act:v[0],say:v[1],avoid:p.no,why:`${nm()}의 ${x.pole} 기질 때문입니다. ${p.sum}`,canned:1}}]}; return render(); }
  q=q.trim().slice(0,LIM.len); if(!q) return;
  if(CRISIS.test(q)){ conv={q,turns:[{q,a:{crisis:1}}]}; return render(); }
  const u=usage(), follow=conv&&conv.cont;
  if(!passOn()){ cerr='이용권이 끝났습니다. 다시 결제하면 이어서 쓸 수 있습니다.'; return render(); }
  if(u.mn>=LIM.mon){ cerr='이번 달 AI 대화 30회를 모두 썼습니다. 자주 묻는 상황은 횟수와 상관없이 볼 수 있습니다.'; return render(); }
  if(u.dn>=LIM.day){ cerr='오늘 AI 대화 5회를 모두 썼습니다. 내일 다시 물어볼 수 있습니다.'; return render(); }
  if(follow && conv.turns.length>LIM.follow){ cerr='한 상황에서는 3번까지 이어 물을 수 있습니다. 새 상황으로 시작해 주세요.'; return render(); }
  if(!follow) conv={q,turns:[]}; conv.cont=false;
  conv.turns.push({q,a:null}); busy=true; render();
  const turn=conv.turns[conv.turns.length-1];
  // 목업: 실제 AI를 부르지 않고, 기질 결과로 조합한 예시 답을 잠시 뒤에 보여 준다. 횟수는 실제처럼 차감한다.
  await new Promise(ok=>setTimeout(ok,700));
  turn.a=mockAns(r,q); u.mn++; u.dn++; save();
  busy=false; render(); }
function ansHTML(a){ if(!a) return `<div class="card"><p class="muted">${esc(nm())}의 기질에 맞춰 답을 쓰고 있습니다…</p></div>`;
  if(a.crisis) return `<div class="help"><h3>혼자 감당하기 어려운 상황으로 보입니다</h3><p>지금 바로 도움을 받을 수 있는 곳입니다. 이 내용은 AI에 보내지 않았습니다.</p><p><b>109</b> 자살예방 상담전화 (24시간)</p><p><b>112</b> 아동학대 신고, 긴급 상황</p></div>`;
  if(a.off) return `<div class="card"><p>아이와의 상황에 대해서만 답할 수 있습니다. 횟수는 차감되지 않았습니다.</p></div>`;
  const row=(l,t,c)=> t? `<div class="stack" style="gap:2px"><span class="lab">${l}</span><p class="${c||''}">${c==='say'||c==='avoid small'?'“'+esc(t)+'”':esc(t)}</p></div>`:'';
  return `<div class="card ans">${a.canned?'<span class="tag" style="align-self:flex-start">미리 써 둔 답 · 횟수 차감 없음</span>':''}${a.mock?'<span class="tag" style="align-self:flex-start">목업 답변 · 실제 서비스에서는 AI가 상황에 맞춰 답합니다</span>':''}
   ${row('나부터',a.me)}${row('이렇게 해 보세요',a.act)}${row('이렇게 말해 보세요',a.say,'say')}${row('피할 말',a.avoid,'avoid small')}${row('왜 통할까요',a.why)}</div>`; }
V.coach=()=>{ if(!done(ITEMS)) return empty('상황별 대화는 정밀검사 결과가 있어야 열립니다.','full');
 if(!st.pass) return V.pass();
 const r=score(), on=passOn(), u=usage(), canFollow=conv&&conv.turns.length&&conv.turns.length<=LIM.follow&&!conv.turns[0].a?.canned&&!conv.turns[conv.turns.length-1].a?.crisis;
 return `<section class="stack" style="padding-top:8px"><span class="eyebrow">${r.code} · ${NICK[r.code]}</span><div class="ttl"><img src="${TM[r.code]}" alt=""><h1>어떻게 말해야 할지 도와줘</h1></div>
   <p class="muted">${esc(nm())}의 기질 결과에 맞춰 답합니다. 양육 참고용이며 전문 상담을 대신하지 않습니다.</p></section>
  <img class="coach-art" src="assets/coach_talk.webp" alt="" width="400" height="400">
  ${passBar()}
  <div class="stack" style="gap:8px"><span class="small muted">자주 묻는 상황 · 횟수 차감 없음</span>
   <div class="chips">${PRE.map((p,i)=>`<button class="chip" data-pre="${i}">${p.t}</button>`).join('')}</div></div>
  ${conv? conv.turns.map(t=>`<div class="bubble">${esc(t.q)}</div>${ansHTML(t.a)}`).join('') : ''}
  ${cerr?`<div class="note">${cerr}</div>`:''}
  ${on? `<form class="card" id="askf">
    <label class="f" for="in-q">${canFollow?'이어서 묻거나 새 상황을 적어 주세요':'지금 겪는 상황을 적어 주세요'}
     <textarea id="in-q" maxlength="${LIM.len}" placeholder="예: 동생이 태어난 뒤로 자꾸 아기처럼 굴고 안아 달라고만 해요" ${busy?'disabled':''}></textarea></label>
    <div class="microw"><button class="mic" type="button" data-mic aria-pressed="false" ${busy?'disabled':''}><img src="assets/ui/i_mic.webp" alt="" width="24" height="24"><span id="mic-l">말로 하기</span></button><span class="small muted" id="mic-s" role="status" aria-live="polite">버튼을 누르고 상황을 말하면 글로 받아 적습니다.</span></div>
    <div class="row">${canFollow?`<button class="btn ghost" type="submit" data-follow="1" ${busy?'disabled':''}>이 상황 이어 묻기 (${conv.turns.length}/${LIM.follow})</button>`:''}<button class="btn" type="submit" ${busy?'disabled':''}>${busy?'답변 쓰는 중':'새 상황 물어보기'}</button></div>
    <p class="small muted">최대 500자. 답변 1회마다 횟수가 1 줄어듭니다.</p></form>`
   : `<div class="cta"><h2>AI 대화는 이용권 기간에만 쓸 수 있습니다</h2><p class="muted">다시 결제하면 2달이 새로 열리고, 다시 검사하기도 1회 포함됩니다.</p><button class="btn" data-buy>다시 결제하기 5,900원</button></div>`}
  ${demoTools()}`; };

/* ---------- 마이크 음성 입력 ---------- */
let rec=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function micUI(on,msg){ const b=$('[data-mic]'), s=$('#mic-s'), l=$('#mic-l'); if(!b) return;
  b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); if(l) l.textContent=on?'듣는 중 · 눌러서 끝내기':'말로 하기'; if(s&&msg!=null) s.textContent=msg; }
function micStop(){ if(rec){ const r=rec; rec=null; try{ r.abort(); }catch(e){} } }
function micToggle(){
  if(rec){ const r=rec; try{ r.stop(); }catch(e){} return; }
  const ta=$('#in-q'); if(!ta) return;
  if(!SR) return micUI(false,'이 브라우저는 음성 입력을 지원하지 않습니다. 키보드의 마이크 버튼을 쓰거나 글로 적어 주세요.');
  const base=ta.value? ta.value.replace(/\s+$/,'')+' ' : ''; let fin='', failed=false;
  const r=new SR(); r.lang='ko-KR'; r.interimResults=true; r.continuous=true; r.maxAlternatives=1;
  r.onstart=()=>micUI(true,'듣고 있어요. 지금 겪는 상황을 편하게 말해 주세요.');
  r.onresult=e=>{ let tmp=''; for(let i=e.resultIndex;i<e.results.length;i++){ const x=e.results[i]; if(x.isFinal) fin+=x[0].transcript.trim()+' '; else tmp+=x[0].transcript; }
    ta.value=(base+fin+tmp).slice(0,LIM.len); ta.scrollTop=ta.scrollHeight;
    if((base+fin+tmp).length>=LIM.len){ try{ r.stop(); }catch(e){} } };
  r.onerror=e=>{ failed=true; const m={'not-allowed':'마이크 사용이 막혀 있습니다. 브라우저 주소창의 사이트 설정에서 마이크를 허용해 주세요.','service-not-allowed':'마이크 사용이 막혀 있습니다. 브라우저 설정에서 마이크를 허용해 주세요.','no-speech':'소리가 들리지 않았어요. 다시 눌러 말해 주세요.','audio-capture':'마이크를 찾지 못했습니다. 기기의 마이크를 확인해 주세요.','network':'음성 인식 서버에 연결하지 못했습니다. 잠시 뒤 다시 해 보세요.'};
    if(e.error!=='aborted') micUI(false,m[e.error]||'음성 입력을 시작하지 못했습니다. 글로 적어 주세요.'); };
  r.onend=()=>{ const mine=rec===r; if(mine) rec=null; if(!mine&&!$('[data-mic]')) return;
    if(!failed){ ta.value=(base+fin).trim().slice(0,LIM.len); micUI(false, fin? '받아 적었어요. 고칠 곳이 있으면 고친 뒤 물어보세요.' : '버튼을 누르고 상황을 말하면 글로 받아 적습니다.'); } else micUI(false); };
  rec=r; try{ r.start(); }catch(e){ rec=null; micUI(false,'음성 입력을 시작하지 못했습니다. 글로 적어 주세요.'); }
}

/* ---------- 라우팅과 이벤트 ---------- */
let view='home';
function render(){
  micStop(); const app=$('#app'); app.innerHTML=(V[view]||V.home)(); document.body.dataset.view=view;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===view));
  window.scrollTo(0,0);
}
function go(v){ if(v==='quick'||v==='full'){ grab();
    if(v==='full'&&!passOn()){ view='pass'; return render(); }
    if(v==='full'&&done(ITEMS)) return go('report');
    startTest(v); view='test'; render(); return; }
  if(location.hash==='#'+v){ view=v; render(); } else location.hash=v; }
function grab(){ const n=$('#in-name'); if(n){ st.name=n.value.trim(); st.age=$('#in-age').value; st.who=$('#in-who').value; save(); } }
function sample(mode){ grab(); const seed=[4,5,2,4,3,5,2,4,1,5,4,2,5,3]; let k=0;
  (mode==='quick'?FREE:ITEMS).forEach(it=>{ const base={A:2,B:4,C:2,D:4}[it.ax]||4; let a=base+(seed[k++%seed.length]>3?0:(k%2?1:-1)); a=Math.max(1,Math.min(5,a)); st.ans[it.id]= it.r? 6-a : a; });
  if(!st.name) st.name='콩이'; if(!st.age) st.age='만 5세'; st.qd=1; st.date=today(); if(mode==='full'&&!passOn()) buyPass(); save(); go(mode==='quick'?'quick-result':'report'); }
const today=()=>{ const d=new Date(); return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0'); };
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.mic!=null) return micToggle();
  if(b.dataset.go) return go(b.dataset.go);
  if(b.dataset.sample) return sample(b.dataset.sample);
  if(b.dataset.buy!=null){ buyPass(); cerr=''; return done(ITEMS)? (view==='coach'? render() : go('report')) : go('full'); }
  if(b.dataset.retest!=null){ if(passOn()&&st.pass.retest<1){ st.prev={code:score().code,date:st.date}; st.pass.retest++; st.ans={}; st.qd=0; save(); go('full'); } return; }
  if(b.dataset.demo==='expire'){ if(st.pass){ st.pass.end=Date.now()-DAY; save(); } return render(); }
  if(b.dataset.demo==='usemax'){ const u=usage(); u.dn=LIM.day; save(); return render(); }
  if(b.dataset.pre!=null){ return ask('',+b.dataset.pre); }
  if(b.type==='submit'){ const f=b.closest('form'); if(f&&f.id==='askf'){ e.preventDefault(); const q=$('#in-q').value; if(conv) conv.cont=!!b.dataset.follow; return ask(q); } }
  if(b.dataset.reset!=null){ st.ans={}; st.qd=0; st.pass=null; st.use={}; st.prev=null; conv=null; save(); return go('home'); }
  if(b.dataset.back!=null){ if(tq.i>0){ tq.i--; render(); } return; }
  if(b.dataset.a){ const cur=tq.list[tq.i]; st.ans[cur.id]=+b.dataset.a; st.date=today();
    if(tq.mode==='quick' && +b.dataset.a===0 && cur.ax){ // 간이검사: 같은 세부 기질의 다른 문항으로 대신 묻기
      const alt=ITEMS.find(x=>x.ax===cur.ax&&x.sub===cur.sub&&st.ans[x.id]==null&&!tq.list.includes(x));
      if(alt) tq.list.splice(tq.i+1,0,alt); }
    if(tq.i===tq.list.length-1){ if(tq.mode==='quick') st.qd=1; }
    save();
    if(tq.i<tq.list.length-1){ tq.i++; render(); } else go(tq.mode==='quick'?'quick-result':'report'); }
});
function route(){ const h=location.hash.slice(1); view= V[h]&&h!=='test'&&h!=='pass'? h : 'home'; render(); }
document.addEventListener('submit',e=>e.preventDefault());
window.addEventListener('hashchange',route);
route();
</script>
