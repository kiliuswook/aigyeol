<style>
/* Art concept C4 "색연필·크레용": warm cream paper, sky blue, pink, leaf green; Gaegu handwritten headings; soft hand-drawn edges; Higgsfield crayon characters. Layout: one narrow phone-first column. */
:root{
  --hero:url(assets/key_home.webp); --paper:url(assets/paper_tile.webp); --head-eb:#8CC4EA;
  --bg:#FBF5EA; --surface:#FFFDF8; --sunk:#F5EDE0; --line:#E2D4BF;
  --fg:#36405A; --muted:#656C80; --accent:#8CC4EA; --accent-ink:#2D6C98; --on-accent:#1F2E45;
  --c1:#DD7356; --c2:#3A9586; --c3:#CF6189; --c4:#4C7CC0; --g:#6A9F45;
  --band:#EFE4D2;
  --display:"Gaegu","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:20px;color:var(--fg);text-decoration:none}
.brand small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{font-size:13px;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:999px}
nav a.on{background:var(--fg);color:var(--bg)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:28px} h2{font-size:21px} h3{font-size:17px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--accent-ink);font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;background:var(--accent);color:var(--on-accent);text-align:center;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.dark{background:var(--fg);color:var(--bg)}
.btn:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--c4);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 180px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.plan{position:relative}
.plan ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--fg);border:1px solid var(--line)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);width:100%}
/* test */
.prog{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.qtext{font-family:var(--display);font-size:22px;line-height:1.5;text-wrap:balance}
.exq{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted);min-height:3.6em}
.exq b{color:var(--accent-ink);margin-right:6px;font-size:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:flex;gap:12px;align-items:center}
.opt b{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.passbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;background:var(--sunk);border-radius:12px;padding:10px 14px;font-size:13px}
.passbar b{font-variant-numeric:tabular-nums}
.price{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.1}
.price small{font-family:var(--body);font-size:14px;font-weight:400;color:var(--muted);margin-left:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
textarea{font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);width:100%;min-height:92px;resize:vertical}
.ans{display:flex;flex-direction:column;gap:12px}
.ans .lab{font-size:12px;font-weight:700;color:var(--accent-ink);letter-spacing:.04em}
.bubble{align-self:flex-end;background:var(--fg);color:var(--bg);border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:90%}
.help{border:2px solid var(--c3);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.opt.unk{border-style:dashed;background:transparent;margin-top:6px}
.opt.sel{border-color:var(--accent);background:var(--sunk)} .opt.sel b{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
/* report */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sheet-head{background:var(--fg);color:var(--bg);padding:18px;display:flex;flex-direction:column;gap:4px}
.sheet-head .eyebrow{color:var(--head-eb)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border-top:1px solid var(--line)}
.meta div{padding:10px 18px;border-bottom:1px solid var(--line);font-size:13px}
.meta span{display:block;color:var(--muted);font-size:12px}
.type{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.code{font-family:var(--display);font-weight:700;font-size:54px;letter-spacing:.12em;line-height:1;display:flex}
.code span{display:inline-block}
.bar{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center;font-size:13px}
.bar .l{text-align:right} .bar .on{font-weight:700}
.track{position:relative;height:14px;background:var(--sunk);border-radius:99px}
.track .mid{position:absolute;left:40%;width:20%;top:0;bottom:0;background:var(--band)}
.track .fill{position:absolute;top:0;bottom:0;border-radius:99px}
.track .dot{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid var(--surface)}
.track.thin{height:8px} .track.thin .dot{width:14px;height:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:8px;background:var(--band);border-radius:3px;margin-right:5px;vertical-align:middle}
.axis-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;color:var(--surface)}
.sub{display:flex;flex-direction:column;gap:4px}
.sub .nm{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.sub .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
details{border-top:1px dashed var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;font-size:14px}
details>div{padding-top:10px;display:flex;flex-direction:column;gap:12px}
.say{border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-family:var(--display)}
.avoid{border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.gauge{display:grid;grid-template-columns:92px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.cmp{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:14px}
.cmp>b{flex:0 0 92px} .cmp .nums{flex:1 1 auto;font-variant-numeric:tabular-nums;font-weight:700} .cmp>p{flex:1 1 100%;margin:0}
.gauge .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.lock{position:relative;border:1px dashed var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.lock h3{font-size:15px;font-family:var(--body);font-weight:700}
.skel{display:flex;flex-direction:column;gap:6px;filter:blur(3px);opacity:.6}
.skel i{display:block;height:9px;border-radius:5px;background:var(--line)}
.note{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:13px}
.cta{background:var(--fg);color:var(--bg);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.cta .muted{color:var(--bg);opacity:.75}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
.tw{overflow-x:auto}
.mk{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
@media (max-width:420px){ h1{font-size:24px} .code{font-size:44px} .qtext{font-size:19px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
/* ---- concept C4: 색연필·크레용 ---- */
h1,h2,h3,.brand,.code,.price,.qtext,.say{font-weight:700}
h1,h2,h3,.qtext,.say{word-break:keep-all} h1{font-size:31px;line-height:1.25} h2{font-size:24px} h3{font-size:19px} .qtext{font-size:25px;line-height:1.4} .say{font-size:19px;line-height:1.45}
html,body{background:var(--bg) var(--paper) repeat;background-size:512px}
.card,.sheet,.lock,.cta,.help{border-radius:24px 20px 26px 19px/20px 25px 19px 24px}
.card,.sheet{border:1.5px solid var(--line);box-shadow:2px 3px 0 color-mix(in srgb,var(--line) 85%,transparent)}
.btn{border-radius:999px 940px 999px 960px/999px 980px 940px 999px;border:1.5px solid color-mix(in srgb,var(--accent-ink) 55%,transparent);box-shadow:1px 3px 0 color-mix(in srgb,var(--accent-ink) 40%,transparent)}
.btn.ghost,.btn.dark{box-shadow:none}
.btn.ghost{border:1.5px solid var(--line)}
.opt{border-radius:20px 17px 21px 18px/18px 21px 17px 20px;border-width:1.5px} .exq,.note,.passbar{border-radius:18px 15px 19px 16px}
input,select,textarea{border-radius:14px;border-width:1.5px}
.brand{display:inline-flex;align-items:center;gap:6px;font-size:24px}
.brand img{width:34px;height:34px;object-fit:contain}
.hero{position:relative;aspect-ratio:4/5;border-radius:26px 22px 28px 21px/22px 27px 21px 26px;overflow:hidden;background:var(--sunk) var(--hero) center 58%/cover;box-shadow:2px 3px 0 var(--line);border:1.5px solid var(--line)}
.hero span{position:absolute;left:14px;top:14px;background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--fg);font-family:var(--display);font-weight:700;font-size:18px;padding:5px 14px;border-radius:999px;border:1.5px solid var(--line)}
.banner{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:24px 20px 26px 19px/20px 25px 19px 24px;border:1.5px solid var(--line)}
.sheet .banner{border:0;border-radius:0}
.coach-art{display:block;width:180px;height:180px;object-fit:contain;align-self:center;margin-block:-6px}
.type{position:relative}
.masc{position:absolute;right:8px;top:4px;width:112px;height:112px;object-fit:contain}
.type>p,.type>h1{max-width:100%}
.ttl{display:flex;align-items:center;gap:10px}
.ttl img{width:72px;height:72px;flex:none;object-fit:contain}
.tag.tm{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 6px}.tag.tm img{width:44px;height:44px;object-fit:contain}
.empty-m{width:120px;height:120px;align-self:center;object-fit:contain}
@media (max-width:420px){ .masc{width:92px;height:92px;right:4px} h1{font-size:28px} .code{font-size:46px} .qtext{font-size:22px} }
/* ---- app shell ---- */
body{padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;gap:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg) var(--paper) repeat;background-size:512px;flex-wrap:nowrap;padding-block:10px}
.brand small{display:none}
.hlink{font-size:12px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,480px);z-index:20;display:grid;grid-template-columns:repeat(3,1fr);gap:0;
  background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));box-shadow:0 -6px 18px color-mix(in srgb,var(--fg) 8%,transparent)}
#nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);padding:4px 2px;border-radius:14px;background:none;min-height:52px}
#nav a .ic{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .15s}
#nav a.on{background:none;color:var(--fg);font-weight:700}
#nav a.on .ic{background:var(--accent);color:var(--on-accent)}
body[data-view="test"] #nav,body[data-view="pay"] #nav{display:none}
body[data-view="test"] .hlink{display:none}
/* 움직임이 끝난 뒤 transform이 남으면 안의 position:fixed(검사 하단 버튼)가 화면이 아닌 이 상자 아래에 붙어 마지막 선택지를 가린다 → backwards로 끝나면 풀고, 고정 바가 있는 화면은 투명도만 움직인다 */
#app>*{animation:rise .28s ease backwards}
#app>*:has(.testbar){animation-name:fadein}
@keyframes rise{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.btn{min-height:52px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;transition:transform .08s}
.btn:active,.opt:active,.chip:active{transform:scale(.97)}
.opt{min-height:56px;font-size:16px;transition:transform .08s}
.chip{min-height:40px}
.row>*{flex:1 1 140px}
.two{grid-template-columns:1fr}
input,select,textarea{font-size:16px;min-height:48px}
.qhelp{border-top:0;padding-top:0}.qhelp summary{font-weight:500;font-size:13px;color:var(--muted)}
.testbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,480px);z-index:20;display:flex;gap:10px;background:var(--bg);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.testbar .btn{flex:1}
.stickycta{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));width:min(100%,480px);z-index:19;animation:none!important;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.stickycta .btn{width:100%;box-shadow:0 6px 18px color-mix(in srgb,var(--accent-ink) 35%,transparent)}
@media (min-width:700px){ body{background:var(--sunk)} .wrap{background:var(--bg) var(--paper) repeat;background-size:512px;min-height:100vh;padding-inline:20px;box-shadow:0 0 0 1px var(--line)} header.top{margin-inline:-20px;padding-inline:20px} }
@media (prefers-reduced-motion:reduce){ #app>*{animation:none} }
.microw{display:flex;flex-direction:column;align-items:stretch;gap:8px} .mic{justify-content:center}
.mic{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:999px;border:2px solid var(--accent);background:var(--surface);color:var(--fg);font:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:transform .08s}
.mic:active{transform:scale(.97)} .mic:disabled{opacity:.5}

/* ---- 손그림 UI (c4_ui, 힉스필드 GPT Image 2.5): 9-slice 테두리 그림, 크레용 막대·점, 손그림 아이콘 ---- */
html,body{background:var(--bg) var(--paper) repeat;background-size:512px}
header.top{border-bottom:0;background:url(assets/ui/d_wave.webp) left bottom/100% 7px no-repeat,var(--bg) var(--paper) repeat;background-size:100% 7px,512px}
/* 카드: 손그림 틀(::before) + 아래에 살짝 비껴 깔린 종이(::after) */
.card,.sheet{position:relative;isolation:isolate;border:0;background:none;box-shadow:none;border-radius:0}
.card::before,.sheet::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border:0 solid transparent;border-image:url(assets/ui/card.webp) 22 fill / 15px / 0 stretch;border-radius:0;box-shadow:none;background:none}
.card::after,.sheet::after{content:"";position:absolute;inset:6px -4px -6px 5px;z-index:-2;pointer-events:none;border:0 solid transparent;border-image:url(assets/ui/box_soft.webp) 27 fill / 14px / 0 stretch;border-radius:0;box-shadow:none;background:none;opacity:.9}
.card:nth-of-type(even)::after{inset:7px 5px -5px -4px}
.card:nth-of-type(3n)::after{inset:5px -3px -7px 2px}
.card.plan[style*="accent"]::before{border-image-source:url(assets/ui/card_blue.webp);border-image-slice:23 fill}
.sheet{padding:12px;overflow:visible}
.sheet .banner{margin:0}
.sheet-head{border:0 solid transparent;border-image:url(assets/ui/box_dark.webp) 30 fill / 14px / 0 stretch;border-radius:0;box-shadow:none;background:none;margin-top:10px;padding:18px 20px;color:var(--bg)}
.meta{border-top:0} .meta div{border-bottom:1px dashed var(--line)}
.cta{border:0 solid transparent;border-image:url(assets/ui/box_dark.webp) 30 fill / 15px / 0 stretch;border-radius:0;box-shadow:none;background:none;padding:24px 22px}
.lock{border:0 solid transparent;border-image:url(assets/ui/box_lock.webp) 23 fill / 13px / 0 stretch;border-radius:0;box-shadow:none;background:none} .lock h3{display:flex;align-items:center;gap:8px} .ico{width:22px;height:22px;flex:none}

};
/* ---------- 문항 펼치기 ---------- */
const ITEMS=[]; const groups=[];
AX.forEach(a=>a.subs.forEach((s,si)=>groups.push(s.items.map((it,i)=>({id:a.id+si+'-'+i,ax:a.id,sub:si,t:it[0],r:it[1],free:it[2],ex:EXS[a.id+si][i]})))));
GR.forEach(g=>groups.push(g.items.map((it,i)=>({id:g.id+'-'+i,gr:g.id,t:it[0],r:it[1],free:0,ex:EXS[g.id][i]}))));
for(let i=0;i<6;i++) groups.forEach(g=>{ if(g[i]) ITEMS.push(g[i]); });
const FREE=ITEMS.filter(x=>x.free);

/* ---------- 상태 ---------- */
// 지금 고른 아이의 기록은 st 바로 아래(KF 필드)에, 다른 아이들의 같은 기록은 st.kids[id] 에 둔다(setKid 로 바꿔 끼움). 아이 순서는 st.korder.
let st={ans:{},name:'',age:'',who:'엄마',date:''};
try{ const s=JSON.parse(localStorage.getItem('aigyeol')||'null'); if(s&&s.ans) st=s; }catch(e){}
const save=()=>{ try{ localStorage.setItem('aigyeol',JSON.stringify(st)); }catch(e){} };
const nm=()=> st.name? st.name : '우리 아이';
const nmEun=()=>{ const n=nm(), c=n.charCodeAt(n.length-1); return esc(n)+((c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?'은':'는'); };
const rid=()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- 양육자별 기록 ---------- */
// 한 아이를 여러 양육자가 따로 검사한다. 지금 고른 양육자(st.who)의 기록은 st 바로 아래(ans, date, qd, prev, paid)에,
// 나머지 양육자의 기록은 st.cgs[이름] = {ans, date, qd, prev, paid, recv} 에 둔다. recv: 다른 휴대폰에서 결과 링크로 받은 기록.
const CGL=['엄마','아빠','할머니','할아버지','기타 양육자'];
const cgNames=()=>{ const s=new Set(CGL); if(st.who) s.add(st.who); Object.keys(st.cgs||{}).forEach(k=>s.add(k)); return [...s]; };
const hasAns=d=> !!d && (Object.keys(d.ans||{}).length>0 || !!d.prev || !!d.paid);
function cgs(){ return cgNames().map(n=> n===st.who? {who:n,ans:st.ans,date:st.date,qd:st.qd,prev:st.prev,paid:st.paid,active:true}
  : (st.cgs&&hasAns(st.cgs[n])? {who:n,...st.cgs[n],ans:st.cgs[n].ans||{}} : null)).filter(Boolean); }
function setWho(n){ if(!n||n===st.who) return; st.cgs=st.cgs||{};
  const mine={ans:st.ans,date:st.date,qd:st.qd,prev:st.prev,paid:st.paid}; if(hasAns(mine)) st.cgs[st.who]=mine; else delete st.cgs[st.who];
  const d=st.cgs[n]||{}; delete st.cgs[n];
  st.who=n; st.ans=d.ans||{}; st.date=d.date||''; st.qd=d.qd||0; st.prev=d.prev||null; st.paid=d.paid||0; save(); }
const answered=ans=> ITEMS.filter(x=>(ans||{})[x.id]!=null).length;
const fullDone=ans=> answered(ans)===ITEMS.length;

/* ---------- 자녀 ---------- */
// 아이마다 따로 저장하는 필드. key: 기기 사이에서 같은 아이를 알아보는 무작위 값(초대·결과 링크에 실림),
// buys: 이 아이의 검사 결제 기록, ext: 다른 휴대폰에서 이미 첫 검사를 결제한 아이(초대로 받은 아이), inv: 받은 초대
const KF=['key','name','age','who','ans','date','qd','prev','paid','cgs','buys','ext','inv'];
const pickKid=()=>Object.fromEntries(KF.map(k=>[k,st[k]]));
const blankKid=()=>({key:rid(),name:'',age:'',who:st.who||'엄마',ans:{},date:'',qd:0,prev:null,paid:0,cgs:{},buys:[],ext:0,inv:null});
function kids(){ return (st.korder||[]).map(id=> id===st.kid? {id,...pickKid(),active:true} : st.kids[id]? {id,...st.kids[id]} : null).filter(Boolean); }
function setKid(id){ if(!id||id===st.kid||!st.kids[id]) return; st.kids[st.kid]=pickKid(); Object.assign(st,blankKid(),st.kids[id]); delete st.kids[id]; st.kid=id; save(); }
function addKid(d){ const id='k'+rid(); st.kids[st.kid]=pickKid(); Object.assign(st,blankKid(),d||{}); st.kid=id; st.korder.push(id); save(); return id; }
const kidName=(k,i)=> k.name || '아이 '+(i+1);
const kidByKey=key=> kids().find(k=>k.key===key);
// 예전 기록 옮기기: 자녀 목록이 없던 기록은 아이 1명으로, 5,900원 이용권을 산 적이 있으면 이미 결제한 검사로 본다
(function migrate(){ if(!st.kid){ st.kid='k1'; st.korder=['k1']; } st.kids=st.kids||{}; if(!st.key) st.key=rid(); st.buys=st.buys||[];
  if(st.pass){ st.paid=1; if(!st.buys.length) st.buys.push({t:st.pass.start,kind:'first',who:st.who,price:0,legacy:1});
    Object.values(st.cgs||{}).forEach(c=>{ if(fullDone(c.ans||{})) c.paid=1; }); }
  delete st.pass; delete st.use; })();

/* ---------- 가격 (바꿀 때는 이곳만 고친다) ---------- */
// first: 아이마다 첫 정밀검사. more: 그 아이의 다른 양육자 검사, 다시 검사하기.
// 실제 앱에서는 구글 플레이 인앱 상품(소모성) 두 개(sku)로 연결하고, 화면 가격은 플레이가 알려 주는 현지 가격으로 바꾼다.
const PRICE={first:1, more:0.5, cur:'USD', sku:{first:'test_first', more:'test_more'}};
const fmtP=p=> '$'+(Number.isInteger(p)? p : p.toFixed(2));
const firstDone=()=> (st.buys||[]).length>0 || !!st.ext;
const nextPrice=()=> firstDone()? PRICE.more : PRICE.first;
// 초대 링크의 '첫 검사 결제됨'(p)은 받는 쪽에서 고칠 수 있다. 시제품은 그대로 믿지만, 실제 앱은 함께 실린 첫 결제 번호(o)를
// 서버가 구글 플레이 구매 기록과 아이 key 로 확인한 뒤에만 $0.50 상품을 연다(docs/systems/pay-share.md).
const firstBuy=()=>{ const b=(st.buys||[])[0]; return b? (b.id||'') : (st.ext&&st.ext.o||''); };

/* ---------- 채점 ---------- */
const v=(it,ans=st.ans)=> !ans[it.id]? null : (it.r? 6-ans[it.id] : ans[it.id]);
const mean=a=> a.length? a.reduce((x,y)=>x+y,0)/a.length : null;
const pct=m=> m==null? null : Math.round((m-1)*25);
function score(ans=st.ans){ const vv=x=>v(x,ans);
  const ax=AX.map(a=>{
    const subs=a.subs.map((s,si)=>pct(mean(ITEMS.filter(x=>x.ax===a.id&&x.sub===si).map(vv).filter(x=>x!=null))));
    const m0=mean(subs.filter(x=>x!=null)); const sc=m0==null?50:Math.round(m0);
    const d=Math.abs(sc-50);
    return {a,subs,sc,letter:sc>=50?a.H:a.L,pole:sc>=50?a.hi:a.lo,clar:d>=20?'뚜렷함':d>=8?'약간':'균형에 가까움',d};
  });
  const gr=GR.map(g=>{ const sc=pct(mean(ITEMS.filter(x=>x.gr===g.id).map(vv).filter(x=>x!=null))); return {g,sc,lv:sc==null?null:sc>=65?2:sc>=40?1:0}; });
  // 응답 일관성: 같은 하위척도 안에서 정방향 문항과 역방향 문항(뒤집은 값)의 평균 차이
  const diffs=[]; groups.forEach(g=>{ const f=g.filter(x=>!x.r).map(vv).filter(x=>x!=null), r=g.filter(x=>x.r).map(vv).filter(x=>x!=null); if(f.length&&r.length) diffs.push(Math.abs(mean(f)-mean(r))); });
  const dm=mean(diffs); const raw=Object.values(ans).filter(x=>x>0); const flat=raw.length>20 && new Set(raw).size===1;
  const cons= dm==null? null : flat? '낮음' : dm<0.9? '높음' : dm<1.5? '보통':'낮음';
  return {ax,gr,code:ax.map(x=>x.letter).join(''),cons,unk:Object.values(ans).filter(x=>x===0).length};
}
/* ---------- 이전 검사와 비교 (성격 탭) ---------- */
// 판정 기준. 확정 전 임시 기준, 감수 필요. 바꾸면 docs/content/report.md 와 docs/systems/save.md 도 고친다.
// same: 점수 차이가 이 값보다 작으면 '비슷함'(6문항 척도에서 답 한 칸 = 약 4.2점, 세 칸 = 12.5점)
// unkHalf: 한 척도 문항 중 '잘 모르겠다' 비율이 이 값 이상이면 그 척도는 비교하지 않음
// sub: 세부 기질(4문항) 점수 차이가 이 값 이상이면 '달라진 세부 기질'로 보여 줌(답 네 칸 = 25점)
// gap: 같은 문항에서 답이 이 칸 수 이상 벌어지면 '크게 바뀐 문항', '양육자 답이 갈린 문항'으로 보여 줌
const CMP={same:12.5, unkHalf:0.5, sub:25, gap:2};
const grUnk=(ans=st.ans)=>Object.fromEntries(GR.map(g=>[g.id,ITEMS.filter(x=>x.gr===g.id&&ans[x.id]===0).length]));
// 다시 검사하기 직전에 남기는 이전 기록. 문항별 답(ans)도 함께 남겨 재검사 화면과 '달라진 점' 탭에 쓴다.
function snapshot(ans=st.ans,date=st.date,who=st.who){ const r=score(ans);
  return {code:r.code,date,who,ax:Object.fromEntries(r.ax.map(x=>[x.a.id,x.sc])),sub:Object.fromEntries(r.ax.map(x=>[x.a.id,x.subs])),
    gr:Object.fromEntries(r.gr.map(x=>[x.g.id,x.sc])),unk:grUnk(ans),ans:{...ans}}; }
function compareGrow(r){ const p=st.prev;
  if(!p||!p.gr||!p.unk) return {none:true}; // 기록 없음, 또는 이 기능 전의 {code,date} 기록
  if(p.who!==st.who) return {p,who:true};
  const cu=grUnk();
  return {p,rows:r.gr.map(x=>{ const id=x.g.id, half=x.g.items.length*CMP.unkHalf, ps=p.gr[id];
    const pb=(p.unk[id]||0)>=half||ps==null, cb=cu[id]>=half||x.sc==null;
    if(pb||cb) return {x,skip:pb&&cb?'이전과 이번 검사 모두':pb?'이전 검사':'이번 검사'};
    const d=x.sc-ps; return {x,ps,v:Math.abs(d)<CMP.same?0:d>0?1:2}; })}; }
const done=(list,ans=st.ans)=> list.every(x=>ans[x.id]!=null);
const quickDone=()=> st.qd||done(FREE);

/* ---------- 그리기 도우미 ---------- */
const M1='assets/mascot_parent.webp', M2='assets/mascot_child.webp';
const TM=Object.fromEntries(Object.keys(NICK).map(k=>[k,`assets/t_${k}.webp`]));
const masc=r=>`<img class="masc" src="${TM[r.code]}" alt="${NICK[r.code]} 말랑이 캐릭터">`;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function bar(x,thin){ const a=x.a, s=x.sc, c=`var(${a.c})`;
  const l=Math.min(s,50), w=Math.abs(s-50);
  return `<div class="bar"><span class="l ${s<50?'on':''}">${a.lo}</span>
   <div class="track ${thin?'thin':''}" role="img" aria-label="${a.lo} ${100-s}, ${a.hi} ${s}"><div class="mid"></div><div class="fill ${a.c.slice(2)}" style="left:${l}%;width:${w}%"></div><div class="dot ${a.c.slice(2)}" style="left:${s}%"></div></div>
   <span class="${s>=50?'on':''}">${a.hi}</span></div>`; }
function subRow(a,s,sc){ if(sc==null) return `<div class="sub"><div class="nm"><span>${s.n}</span><span class="muted">정보 부족</span></div><p class="small muted">이 항목은 '잘 모르겠다'로 답한 문항이 많아 판단하지 않았습니다.</p></div>`; return `<div class="sub"><div class="nm"><span>${s.n}</span><span class="muted">${sc<40?s.lo:sc>60?s.hi:'중간'}</span></div>
  <div class="track thin"><div class="mid"></div><div class="dot ${a.c.slice(2)}" style="left:${sc}%"></div></div>
  <div class="ends"><span>${s.lo}</span><span>${s.hi}</span></div></div>`; }
const codeHTML=r=> `<div class="code" aria-label="유형 코드 ${r.code}">${r.ax.map(x=>`<span style="color:var(${x.a.c})">${x.letter}</span>`).join('')}</div>`;
const oneLine=r=> `${P[r.ax[0].letter].ph}, ${P[r.ax[1].letter].ph}, ${P[r.ax[2].letter].ph}, ${P[r.ax[3].letter].ph}입니다.`;

/* ---------- 화면 ---------- */
const V={};
V.home=()=>{ const ks=kids(), full=done(ITEMS), n=answered(st.ans), p=nextPrice();
 const kidChips= ks.length>1||st.name||n? `<div class="chips" role="group" aria-label="검사할 아이">${ks.map((k,i)=>{ const c=fullDone(k.ans)? score(k.ans).code : null;
   return `<button class="chip" data-kid="${k.id}" aria-pressed="${!!k.active}">${esc(kidName(k,i))}${c?' · '+c:''}</button>`; }).join('')}<button class="chip add" data-addkid aria-label="아이 추가하기">+ 아이 추가</button></div>` : '';
 const main= full&&st.paid? `<button class="btn dark" data-go="report">${esc(st.who)}의 리포트 보기</button>`
   : st.paid? `<button class="btn dark" data-go="full">정밀검사 이어서 하기 (${n}/${ITEMS.length})</button>`
   : `<button class="btn dark" data-go="full">${fmtP(p)} 결제하고 검사 시작</button>`;
 return `
 <div class="hero" role="img" aria-label="풀밭에서 엄마 말랑이가 무릎을 굽혀 아이 말랑이와 눈을 맞추고 이야기하는 색연필 그림"><span>오늘도 말랑하게, 우리 아이 이야기</span></div>

let tq={list:[],i:0,mode:''};
function startTest(mode){ tq.mode=mode; tq.list= mode==='quick'? FREE.slice() : ITEMS.filter(x=>st.ans[x.id]==null); if(mode==='full'&&!tq.list.length) tq.list=ITEMS; tq.i=0; }
// 다시 검사하기 중인지: 정밀검사이고, 이 양육자의 이전 기록에 문항별 답이 남아 있을 때
const retesting=()=> tq.mode==='full' && !!(st.prev&&st.prev.ans);
V.test=()=>{ const it=tq.list[tq.i], n=tq.list.length, re=retesting();
 // 다시 검사할 때만 선택지 옆에 지난번 내 답과 다른 양육자의 답을 표시한다(처음 검사할 때는 서로의 답에 끌리지 않도록 숨김)
 const others= re? cgs().filter(c=>!c.active&&c.ans[it.id]!=null) : [];
 const marks=k=>{ const m=[]; if(re&&st.prev.ans[it.id]===k) m.push('<span class="mk me">지난번 나</span>');
   others.forEach(o=>{ if(o.ans[it.id]===k) m.push(`<span class="mk">${esc(o.who)}</span>`); }); return m.length?`<span class="omk">${m.join('')}</span>`:''; };
 return `<div class="stack" style="gap:18px;padding-top:8px">
  <div class="stack" style="gap:6px"><div class="small muted" style="display:flex;justify-content:space-between"><span>${tq.mode==='quick'?'1분 간이검사':re?'다시 검사하기 · '+esc(st.who):'내 아이의 MBTI 정밀검사 · '+esc(st.who)}</span><span>${tq.i+1} / ${n}</span></div>
  <div class="prog"><i style="width:${(tq.i)/n*100}%"></i></div></div>
  ${re?`<p class="note small" data-retest-note><b>다시 검사 중입니다.</b> 선택지 옆에 <b>지난번 나</b>(${esc(st.prev.date||'이전 검사')})${others.length||cgs().some(c=>!c.active)?'와 다른 양육자':''}가 고른 답이 보입니다. 지난 답에 맞추지 말고 요즘 모습대로 골라 주세요.</p>`:''}
  <p class="small muted">최근 한 달간 ${esc(nm())}의 모습에 가장 가까운 것을 골라 주세요.</p>
  <div class="stack" style="gap:8px"><p class="qtext">${esc(it.t)}</p><p class="exq"><b>예</b> ${esc(it.ex)}</p></div>
  <div class="opts">${OPT.map((o,k)=>`<button class="opt ${st.ans[it.id]===k+1?'sel':''}" data-a="${k+1}"><b>${k+1}</b>${o}${marks(k+1)}</button>`).join('')}
   <button class="opt unk ${st.ans[it.id]===0?'sel':''}" data-a="0"><b>?</b><span>잘 모르겠다 <span class="muted small">본 적이 없거나 판단하기 애매해요</span></span>${marks(0)}</button></div>
  <details class="qhelp"><summary>답하기 애매할 때</summary><div><p class="small muted">'보통이다'는 그럴 때도 있고 아닐 때도 있다는 뜻입니다. 예시와 꼭 같지 않아도 비슷한 모습이면 됩니다. 떠오르는 장면이 없으면 '잘 모르겠다'를 골라 주세요. 그 문항은 점수에 넣지 않고 비슷한 다른 문항으로 판단합니다.</p></div></details>
  <div class="testbar"><button class="btn ghost" data-back ${tq.i===0?'disabled':''}>이전 문항</button><button class="btn ghost" data-go="home">나중에 하기</button></div>
 </div>`; };

// 리포트 탭: 'temp' 기질, 'grow' 성격(자라는 힘). 화면 안의 상태라 주소와 아래 메뉴는 바뀌지 않는다.

// 성격 탭의 '이전 검사와 비교' 카드. 판정 기준은 CMP.
const CMPV=[['비슷함','c2'],['자랐음','c4'],['낮아졌음','c1']];
function cmpHTML(r){ const c=compareGrow(r);
 const head=`<div><span class="eyebrow">이전 검사와 비교</span><h2>지난번과 달라진 점</h2>${c.p?`<p class="small muted">이전 검사 ${esc(c.p.date||'날짜 없음')} · 평가자 ${esc(c.p.who)}${c.p.sample?' · 샘플 예시 기록':''}</p>`:''}</div>`;
 let body;
 if(c.none) body=`<p data-cmp="none"><b>비교 기록 없음.</b> <span class="small muted">비교할 이전 점수가 남아 있지 않습니다. 리포트 아래 '다시 검사하기'를 하면 그 전 점수가 남아 이곳에 나란히 보입니다.</span></p>`;
 else if(c.who) body=`<p data-cmp="who"><b>평가자가 달라 직접 비교하기 어렵습니다.</b> <span class="small muted">이전 검사는 ${esc(c.p.who)}, 이번 검사는 ${esc(st.who)}가 답했습니다. 같은 아이라도 답하는 사람의 시선에 따라 점수가 달라질 수 있어 숫자를 나란히 놓지 않았습니다.</span></p>`;
 else body=c.rows.map(o=> o.skip? `<div class="cmp" data-cmp="skip"><b>${o.x.g.n}</b><p class="small muted">${o.skip}에서 '잘 모르겠다'가 절반 이상이라 비교하지 않았습니다.</p></div>`
   : `<div class="cmp" data-cmp="${CMPV[o.v][0]}"><b>${o.x.g.n}</b><span class="nums">이전 ${o.ps} → 지금 ${o.x.sc}</span><span class="pill ${CMPV[o.v][1]}">${CMPV[o.v][0]}</span></div>`).join('')
   +`<p class="small muted">작은 점수 차이는 답하는 날의 기분이나 상황으로도 생기므로 '비슷함'으로 봅니다. 순위나 진단이 아니라 같은 평가자가 본 변화의 방향입니다.</p>`;
 return `<section class="card">${head}${body}</section>`; }
/* ---------- 양육자별 결과 · 양육자 비교 · 달라진 점 ---------- */
const OPTN=a=> a===0? '잘 모르겠다' : OPT[a-1];
const cgCode=c=> fullDone(c.ans)? score(c.ans).code : null;
// 홈: 양육자별 검사 현황(누군가 답을 시작했을 때만)
function cgStatus(){ const all=cgs().filter(c=>Object.keys(c.ans).length||c.prev); if(!all.length) return '';
 return `<div class="stack" style="gap:8px" data-cgstatus><span class="small muted">양육자별 검사 현황</span>${all.map(c=>{ const code=cgCode(c), n=answered(c.ans);
  return `<div class="cgst">${code?`<img src="${TM[code]}" alt="">`:`<img src="${M2}" alt="" style="opacity:.5">`}<b>${esc(c.who)}${c.active?' <span class="mk">지금 답하는 사람</span>':''}</b><span class="small muted">${code?`${code} ${NICK[code]}`:c.qd&&n<ITEMS.length?`간이검사 완료 · 정밀 ${n}/${ITEMS.length}`:`정밀 ${n}/${ITEMS.length}`}${c.prev?' · 다시 검사함':''}</span></div>`; }).join('')}</div>`; }
// 리포트·대화 위: 양육자 고르기. 누르면 그 양육자의 결과로 바뀐다. 아직 안 한 양육자는 '+ 이름'으로 바로 검사 시작
function cgSwitch(){ const all=cgs(), has=new Set(all.map(c=>c.who)), ks=kids();
 const add=CGL.filter(n=>!has.has(n)).slice(0,3);
 return `<section class="card" style="gap:10px">${ks.length>1?`<div class="axis-h"><h3>아이</h3></div><div class="chips" role="group" aria-label="결과를 볼 아이">${ks.map((k,i)=>`<button class="chip" data-kid="${k.id}" aria-pressed="${!!k.active}">${esc(kidName(k,i))}</button>`).join('')}</div>`:''}<div class="axis-h"><h3>양육자별 결과</h3><a class="small" href="#share">다른 휴대폰으로 초대</a></div>
  <div class="chips" role="group" aria-label="결과를 볼 양육자">${all.map(c=>{ const code=cgCode(c); return `<button class="chip" data-cg="${esc(c.who)}" aria-pressed="${!!c.active}">${esc(c.who)} · ${code||answered(c.ans)+'/'+ITEMS.length}</button>`; }).join('')}
  ${add.map(n=>`<button class="chip add" data-addcg="${esc(n)}" aria-label="${esc(n)}도 검사하기">+ ${esc(n)}</button>`).join('')}</div></section>`; }

// '양육자 비교' 탭: 정밀검사를 마친 양육자 둘 이상의 결과를 나란히 놓고 다르게 본 점을 정리
function cgHTML(){ const all=cgs(), fin=all.filter(c=>fullDone(c.ans));
 const head=`<div><span class="eyebrow">양육자 비교</span><h2>양육자마다 다르게 본 점</h2><p class="small muted">같은 아이도 함께 지내는 시간과 장면이 달라 다르게 보일 수 있습니다. 어느 쪽이 맞다는 뜻이 아니라, ${esc(nm())}가 사람과 상황에 따라 다른 모습을 보인다는 단서입니다.</p></div>`;
 if(fin.length<2){ const has=new Set(all.map(c=>c.who));
  return `<section class="card" data-cgcmp="wait">${head}<p><b>비교할 양육자가 아직 없습니다.</b> <span class="small muted">정밀검사를 마친 양육자가 두 명 이상이면 이곳에 결과가 나란히 정리됩니다. 지금 마친 사람: ${fin.map(c=>esc(c.who)).join(', ')||'없음'}.</span></p><p class="small muted">다른 휴대폰을 쓰는 양육자는 초대 링크로 검사하고 결과를 보내 주면 이곳에 합쳐집니다. <a href="#share">초대 보내기</a></p>
   <div class="chips">${CGL.filter(n=>!has.has(n)).slice(0,3).map(n=>`<button class="chip add" data-addcg="${esc(n)}" aria-label="${esc(n)}도 검사하기">+ ${esc(n)}</button>`).join('')}</div></section>`; }
 const rs=fin.map(c=>({c,r:score(c.ans)}));
 const codes=[...new Set(rs.map(x=>x.r.code))];
 const axv=AX.map((a,i)=>{ const sc=rs.map(x=>x.r.ax[i].sc), letters=new Set(rs.map(x=>x.r.ax[i].letter)), range=Math.max(...sc)-Math.min(...sc);
   return {a,i,range,split:letters.size>1,v:letters.size>1?['시선이 갈림','c1']:range>=CMP.same?['정도가 다름','c3']:['비슷하게 봄','c2']}; });
 const splitAx=axv.filter(x=>x.split);
 const summary= codes.length===1? `${rs.map(x=>esc(x.c.who)).join(', ')} 모두 <b>${codes[0]} ${NICK[codes[0]]}</b>로 같은 유형이 나왔습니다.`
   : `${rs.map(x=>`${esc(x.c.who)}는 <b>${x.r.code}</b>`).join(', ')}로 유형이 다르게 나왔습니다.`;
 const summary2= splitAx.length? ` <b>${splitAx.map(x=>x.a.hi+'·'+x.a.lo).join(', ')}</b> 축에서 방향이 갈렸고, 나머지 ${4-splitAx.length}축은 같은 방향입니다.` : ' 네 축 모두 같은 방향으로 보았습니다.';
 const axes=axv.map(x=>`<div class="stack" style="gap:6px" data-cgax="${x.a.id}">
   <div class="axis-h"><h3>${x.a.hi} · ${x.a.lo}</h3><span class="pill ${x.v[1]}">${x.v[0]}</span></div>
   ${rs.map(o=>{ const s=o.r.ax[x.i]; return `<div class="cgrow"><b>${esc(o.c.who)}</b><div class="track thin" role="img" aria-label="${esc(o.c.who)} ${x.a.hi} ${s.sc}"><div class="mid"></div><div class="dot ${x.a.c.slice(2)}" style="left:${s.sc}%"></div></div><span class="num">${s.letter}</span></div>`; }).join('')}
   <div class="sub"><div class="ends"><span>← ${x.a.lo}</span><span>${x.a.hi} →</span></div></div>
   ${x.split?`<p class="small">${rs.map(o=>`${esc(o.c.who)}는 ${o.r.ax[x.i].pole}`).join(', ')} 쪽으로 보았습니다. ${x.a.q}의 모습이 함께 있는 사람이나 장소에 따라 달라질 수 있습니다.</p>`:''}
  </div>`).join('');
 const grow=GR.map((g,gi)=>{ const sc=rs.map(o=>o.r.gr[gi].sc), ok=sc.filter(s=>s!=null), range=ok.length>1?Math.max(...ok)-Math.min(...ok):null;
   return `<div class="cmp"><b>${g.n}</b><span class="nums">${rs.map((o,k)=>`${esc(o.c.who)} ${sc[k]==null?'판단 안 함':sc[k]}`).join(' · ')}</span>${range==null?'':`<span class="pill ${range<CMP.same?'c2':'c3'}">${range<CMP.same?'비슷하게 봄':'정도가 다름'}</span>`}</div>`; }).join('');
 // 답이 크게 갈린 문항: 양육자들이 고른 답(1~5, '잘 모르겠다' 제외)의 차이가 CMP.gap칸 이상
 const split=ITEMS.map(it=>{ const a=rs.map(o=>o.c.ans[it.id]).filter(x=>x>0); return {it,spread:a.length>1?Math.max(...a)-Math.min(...a):0}; })
   .filter(x=>x.spread>=CMP.gap).sort((x,y)=>y.spread-x.spread);
 const qrow=x=>`<div class="dq"><p class="small"><b>${esc(x.it.t)}</b></p><div class="who">${rs.map(o=>`<span><b>${esc(o.c.who)}</b> ${OPTN(o.c.ans[x.it.id])}</span>`).join('')}</div></div>`;
 return `<section class="card" data-cgcmp="ok">${head}<p>${summary}${summary2}</p>
   <div class="row">${rs.map(o=>`<div class="ttl" style="gap:6px"><img src="${TM[o.r.code]}" alt="" style="width:52px;height:52px"><div><b>${esc(o.c.who)}</b><p class="small muted">${o.r.code} · ${esc(o.c.date||'')}</p></div></div>`).join('')}</div></section>
  <section class="card"><h2>기질 4축, 사람마다</h2>${axes}<p class="small muted">점 위치는 0~100 점수입니다. 가운데 옅은 띠(40~60)는 균형 구간입니다. 같은 방향이어도 ${CMP.same}점 넘게 벌어지면 '정도가 다름'으로 표시합니다.</p></section>
  <section class="card"><h2>자라는 힘, 사람마다</h2>${grow}</section>
  <section class="card" data-cgsplit="${split.length}"><h2>답이 크게 갈린 문항</h2>
   ${split.length? `<p class="small muted">같은 문항에 ${CMP.gap}칸 이상 다른 답을 고른 문항 ${split.length}개입니다. 이 장면을 언제, 어디서 봤는지 서로 이야기해 보면 아이를 더 넓게 이해할 수 있습니다.</p>
    <div>${split.slice(0,6).map(qrow).join('')}</div>${split.length>6?`<details><summary>나머지 ${split.length-6}문항 더 보기</summary><div>${split.slice(6).map(qrow).join('')}</div></details>`:''}`
    : `<p class="small muted">${CMP.gap}칸 이상 벌어진 문항이 없습니다. 양육자들이 ${esc(nm())}를 꽤 비슷하게 보고 있습니다.</p>`}
  </section>
  <div class="note"><b>함께 맞춰 보기.</b> 시선이 갈린 축은 ${esc(nm())}가 ${splitAx.length?'그 사람 앞에서':'상황에 따라'} 다른 모습을 보이는 부분일 수 있습니다. 양육자끼리 '잘 통하는 말'을 하나 정해 같은 말로 대해 주면 아이가 덜 헷갈립니다.</div>`; }

// '달라진 점' 탭: 이 양육자의 이전 검사(다시 검사하기 전)와 지금 결과를 비교
function changeHTML(r){ const p=st.prev;
 const head=`<div><span class="eyebrow">이전 검사와 비교 · ${esc(st.who)}</span><h2>다시 검사로 달라진 점</h2>${p?`<p class="small muted">이전 검사 ${esc(p.date||'날짜 없음')} → 이번 검사 ${esc(st.date)} · 평가자 ${esc(p.who||st.who)}${p.sample?' · 샘플 예시 기록':''}</p>`:''}</div>`;
 if(!p) return `<section class="card" data-chg="none">${head}<p><b>비교 기록 없음.</b> <span class="small muted">${esc(st.who)}의 이전 검사 기록이 없습니다. 리포트 아래 '다시 검사하기'를 하면 지금 결과가 이전 기록으로 남고, 다시 답한 결과와 나란히 정리됩니다.</span></p></section>`;
 if(p.who&&p.who!==st.who) return `<section class="card" data-chg="who">${head}<p><b>평가자가 달라 직접 비교하기 어렵습니다.</b> <span class="small muted">이전 검사는 ${esc(p.who)}, 이번 검사는 ${esc(st.who)}가 답했습니다. 양육자 사이의 차이는 '양육자 비교' 탭에서 볼 수 있습니다.</span></p></section>`;
 const axr=p.ax? r.ax.map(x=>{ const ps=p.ax[x.a.id], d=x.sc-ps, flip=(ps>=50)!==(x.sc>=50);
   return {x,ps,d,flip,v:flip?[`${ps>=50?x.a.hi:x.a.lo} → ${x.pole}`,'c1']:Math.abs(d)<CMP.same?['비슷함','c2']:[`${d>0?x.a.hi:x.a.lo} 쪽으로 이동`,'c4']}; }) : [];
 const moved=axr.filter(o=>o.flip||Math.abs(o.d)>=CMP.same);
 const subs=p.sub? r.ax.flatMap(x=>x.a.subs.map((s,i)=>({x,s,ps:p.sub[x.a.id]?.[i],cs:x.subs[i]}))).filter(o=>o.ps!=null&&o.cs!=null&&Math.abs(o.cs-o.ps)>=CMP.sub) : [];
 const ch=p.ans? ITEMS.filter(it=>p.ans[it.id]!=null&&st.ans[it.id]!=null&&p.ans[it.id]!==st.ans[it.id]) : [];
 const big=ch.filter(it=>p.ans[it.id]>0&&st.ans[it.id]>0&&Math.abs(p.ans[it.id]-st.ans[it.id])>=CMP.gap).sort((a,b)=>Math.abs(p.ans[b.id]-st.ans[b.id])-Math.abs(p.ans[a.id]-st.ans[a.id]));
 const unkCh=ch.filter(it=>p.ans[it.id]===0||st.ans[it.id]===0);
 const sum=`${p.code===r.code?`유형은 <b>${r.code}</b> 그대로입니다.`:`유형이 <b>${esc(p.code)}</b>에서 <b>${r.code}</b>로 바뀌었습니다.`}`
   +(axr.length? moved.length? ` 4축 중 <b>${moved.map(o=>o.x.a.hi+'·'+o.x.a.lo).join(', ')}</b> 축이 움직였고, 나머지는 비슷합니다.` : ' 4축 모두 비슷합니다.' : '')
   +(p.ans? ` ${ITEMS.length}문항 중 <b>${ch.length}문항</b>의 답이 바뀌었습니다.` : '');
 const qrow=it=>`<div class="dq"><p class="small"><b>${esc(it.t)}</b></p><div class="who"><span><b>이전</b> ${OPTN(p.ans[it.id])}</span><span><b>지금</b> ${OPTN(st.ans[it.id])}</span></div></div>`;
 const g=compareGrow(r);
 return `<section class="card" data-chg="ok">${head}<p>${sum}</p>
   ${p.code!==r.code?`<div class="row" style="align-items:center">${TM[p.code]?`<div class="ttl" style="gap:6px"><img src="${TM[p.code]}" alt="" style="width:52px;height:52px;opacity:.6"><div><span class="small muted">이전</span><p><b>${esc(p.code)}</b> ${NICK[p.code]||''}</p></div></div>`:''}<div class="ttl" style="gap:6px"><img src="${TM[r.code]}" alt="" style="width:52px;height:52px"><div><span class="small muted">지금</span><p><b>${r.code}</b> ${NICK[r.code]}</p></div></div></div>`:''}</section>
  ${axr.length?`<section class="card"><h2>기질 4축 변화</h2>${axr.map(o=>`<div class="stack" style="gap:6px" data-chgax="${o.x.a.id}">
    <div class="axis-h"><b>${o.x.a.hi} · ${o.x.a.lo}</b><span class="pill ${o.v[1]}">${o.v[0]}</span></div>
    <div class="bar"><span class="l">${o.x.a.lo}</span><div class="track thin" role="img" aria-label="이전 ${o.ps}, 지금 ${o.x.sc}"><div class="mid"></div><div class="dot was" style="left:${o.ps}%"></div><div class="dot ${o.x.a.c.slice(2)}" style="left:${o.x.sc}%"></div></div><span>${o.x.a.hi}</span></div>
    <p class="small muted">이전 ${o.ps} → 지금 ${o.x.sc}</p></div>`).join('')}
    <div class="legend"><span><img src="assets/ui/dot_ring.webp" alt="" width="14" height="14" style="vertical-align:middle;margin-right:4px">이전</span><span>색 점: 지금</span><span>${CMP.same}점보다 작은 차이는 '비슷함'</span></div></section>`:''}
  ${subs.length?`<section class="card"><h2>달라진 세부 기질</h2>${subs.map(o=>`<div class="cmp"><b style="flex-basis:auto">${o.s.n}</b><span class="nums">이전 ${o.ps} → 지금 ${o.cs}</span><p class="small muted">${o.cs>o.ps?o.s.hi:o.s.lo} 쪽으로 ${Math.abs(o.cs-o.ps)}점 움직였습니다.</p></div>`).join('')}</section>`:''}
  ${g.rows?`<section class="card"><h2>자라는 힘 변화</h2>${g.rows.map(o=> o.skip? `<div class="cmp"><b>${o.x.g.n}</b><p class="small muted">${o.skip}에서 '잘 모르겠다'가 절반 이상이라 비교하지 않았습니다.</p></div>`
     : `<div class="cmp"><b>${o.x.g.n}</b><span class="nums">이전 ${o.ps} → 지금 ${o.x.sc}</span><span class="pill ${CMPV[o.v][1]}">${CMPV[o.v][0]}</span></div>`).join('')}</section>`:''}
  ${p.ans?`<section class="card" data-chgq="${big.length}"><h2>답이 크게 바뀐 문항</h2>
   ${big.length? `<p class="small muted">${CMP.gap}칸 이상 다른 답을 고른 문항 ${big.length}개입니다. 이 장면에서 요즘 무엇이 달라졌는지 떠올려 보세요.</p><div>${big.slice(0,6).map(qrow).join('')}</div>${big.length>6?`<details><summary>나머지 ${big.length-6}문항 더 보기</summary><div>${big.slice(6).map(qrow).join('')}</div></details>`:''}`
    : `<p class="small muted">${CMP.gap}칸 이상 바뀐 문항은 없습니다.</p>`}
   ${unkCh.length?`<p class="small muted">'잘 모르겠다'로 바뀌었거나 '잘 모르겠다'에서 답이 생긴 문항이 ${unkCh.length}개 있습니다.</p>`:''}</section>`:''}
  <div class="note">두 검사 사이의 차이는 아이가 자란 모습일 수도, 답한 날의 기분이나 최근 일의 영향일 수도 있습니다. 작은 차이는 '비슷함'으로 보고, 크게 바뀐 문항 위주로 살펴보세요.</div>`; }

V.report=()=>{ if(!done(ITEMS)) return cgSwitch()+empty('아직 정밀검사 결과가 없습니다.','full');
 if(!st.paid) return V.pay();
 const r=score();
 const axes=r.ax.map(x=>{ const p=P[x.letter], bal=x.d<8;
  return `<section class="card">
   <div class="axis-h"><div><span class="small muted">${x.a.q}</span><h2>${x.a.hi} · ${x.a.lo}</h2></div><span class="pill ${x.a.c.slice(2)}">${x.pole} ${x.clar}</span></div>
   ${bar(x)}
   <p><b>요약.</b> ${bal?`두 성향의 가운데에 가깝습니다. 상황에 따라 ${x.a.hi}, ${x.a.lo} 두 모습을 오가며, 굳이 나누면 ${x.pole} 쪽입니다. `:''}${p.sum}</p>
   <div class="tags">${p.tags.map(t=>`<span class="tag">#${t}</span>`).join('')}</div>
   <details><summary>상세 설명과 세부 기질 보기</summary><div>
    <p>${p.det}</p>
    ${x.a.subs.map((s,i)=>subRow(x.a,s,x.subs[i])).join('')}
    <div class="stack" style="gap:6px"><span class="small muted">이렇게 말해 보세요</span><p class="say">“${p.say}”</p><p class="avoid small">“${p.no}”</p></div>
   </div></details>
  </section>`; }).join('');
 const grow=r.gr.map(x=> x.sc==null? `<div class="stack" style="gap:6px"><b>${x.g.n}</b><p class="small muted">'잘 모르겠다'로 답한 문항이 많아 판단하지 않았습니다.</p></div>` : `<div class="stack" style="gap:6px">
   <div class="gauge"><b>${x.g.n}</b><div class="track thin"><div class="fill g" style="left:0;width:${x.sc}%"></div></div><span class="num">${x.sc}</span></div>
   <p class="small"><b>${['지금 자라는 중','고르게 자라는 중','탄탄함'][x.lv]}.</b> ${x.g.lv[x.lv][0]}</p>
   <details><summary>상세 설명</summary><div><p class="small">${x.g.lv[x.lv][1]}</p></div></details></div>`).join('');
 const tab=(id,t)=>`<button class="rtab" type="button" role="tab" id="rtab-${id}" data-rtab="${id}" aria-controls="rpanel-${id}" aria-selected="${rtab===id}" tabindex="${rtab===id?0:-1}">${t}</button>`;
 return `${cgSwitch()}<div class="sheet"><i class="clip" aria-hidden="true"></i>
   <figure class="banner"><img src="assets/banner_result.webp" alt="" width="1000" height="560"></figure>
   <div class="sheet-head"><span class="eyebrow">내 아이의 MBTI · 정밀검사</span><h2>정밀검사 결과 보고서</h2><p class="small" style="opacity:.8">기질 결과와 성격(자라는 힘) 결과</p></div>
   <div class="meta">
    <div><span>이름</span>${esc(nm())}</div><div><span>연령</span>${esc(st.age||'미입력')}</div><div><span>평가자</span>${esc(st.who)}</div>
    <div><span>검사일</span>${esc(st.date)}${st.prev?` · 이전 ${st.prev.code}`:''}</div><div><span>문항</span>66문항 · 5점 척도</div><div><span>응답 일관성</span>${r.cons||'판단 불가'} · 잘 모르겠다 ${r.unk}문항</div>
   </div>
  </div>
  <div class="rtabs" role="tablist" aria-label="결과 나누어 보기">${tab('temp','기질')}${tab('grow','성격(자라는 힘)')}${tab('cg','양육자 비교')}${tab('chg','달라진 점')}</div>
  <div class="stack rpanel" role="tabpanel" id="rpanel-temp" aria-labelledby="rtab-temp" ${rtab==='temp'?'':'hidden'}>
  <section class="card type">
   <span class="eyebrow">기질 유형</span>${masc(r)}
   ${codeHTML(r)}
   <h1>${NICK[r.code]}</h1>
   <p>${nmEun()} ${oneLine(r)}</p>
  </section>
  <section class="card">
   <h2>한눈에 보는 기질 프로필</h2>
   ${r.ax.map(x=>bar(x)).join('')}
   <div class="legend"><span><i></i>균형 구간(40~60)</span><span>점이 끝에 가까울수록 성향이 뚜렷합니다</span></div>
  </section>
  ${axes}
  <section class="card">
   <h2>강점과 살펴볼 점</h2>
   <div class="two">
    <div class="stack" style="gap:6px"><h3>타고난 강점</h3>${r.ax.map(x=>`<p class="small">· ${P[x.letter].st}</p>`).join('')}</div>
    <div class="stack" style="gap:6px"><h3>살펴볼 점</h3>${r.ax.map(x=>`<p class="small">· ${P[x.letter].wa}</p>`).join('')}</div>
   </div>
  </section>
  <section class="card">
   <h2>${esc(nm())}에게 잘 통하는 말</h2>
   ${r.ax.map(x=>`<div class="stack" style="gap:4px"><span class="small muted">${x.pole} 기질에게</span><p class="say">“${P[x.letter].say}”</p></div>`).join('')}
  </section>
  </div>
  <div class="stack rpanel" role="tabpanel" id="rpanel-grow" aria-labelledby="rtab-grow" ${rtab==='grow'?'':'hidden'}>
  <section class="card">
   <div><span class="eyebrow">성격 결과</span><h2>자라는 힘</h2><p class="small muted">기질은 타고나지만 끈기, 스스로 힘, 함께 힘은 경험으로 자랍니다. 나이가 어릴수록 낮게 나오는 것이 자연스럽습니다.</p></div>
   ${grow}
  </section>
  ${cmpHTML(r)}
  </div>
  <div class="stack rpanel" role="tabpanel" id="rpanel-cg" aria-labelledby="rtab-cg" ${rtab==='cg'?'':'hidden'}>${cgHTML()}</div>
  <div class="stack rpanel" role="tabpanel" id="rpanel-chg" aria-labelledby="rtab-chg" ${rtab==='chg'?'':'hidden'}>${changeHTML(r)}</div>
  <div class="note">
   <b>결과를 읽을 때.</b> 이 보고서는 ${esc(st.who)}가 관찰한 내용을 바탕으로 하므로 평가자의 시선이 반영됩니다. 다른 양육자가 답하면 결과가 달라질 수 있으며, '양육자 비교' 탭에서 나란히 볼 수 있습니다.
   ${r.cons==='낮음'?' 이번 응답은 비슷한 문항 사이에 답이 엇갈린 경우가 많아, 시간을 두고 다시 검사해 보기를 권합니다.':''}
   점수는 또래와 비교한 순위가 아니라 문항 응답으로 본 아이 안의 경향입니다. 기질에는 좋고 나쁨이 없으며, 이 검사는 의학적 진단이나 발달 평가를 대신하지 않습니다.
  </div>
  <section class="cta">
   <h2>${esc(nm())}의 결과를 함께 보세요</h2>
   <p class="muted">친구·가족에게 결과 카드를 보내거나, 다른 휴대폰의 공동 양육자가 따로 검사하게 초대할 수 있습니다.</p>
   <a class="btn" href="#share">${st.inv?esc(st.inv.from||'가족')+'에게 결과 보내기':'공유하기'}</a>
  </section>
  <div class="row"><button class="btn ghost" data-retest>다시 검사하기 · ${fmtP(PRICE.more)}</button><a class="btn ghost" href="#blueprint">문항과 정책 보기</a></div>
  ${demoTools()}`; };

const b64e=o=> btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>{ try{ s=s.replace(/-/g,'+').replace(/_/g,'/'); return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))); }catch(e){ return null; } };
// 문항 답을 66글자로: 문항 순서대로 0~5, 답 없음은 '-'

async function copyLink(u){ try{ await navigator.clipboard.writeText(u); }catch(e){ const t=document.createElement('textarea'); t.value=u; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); }catch(_){} t.remove(); }

// via: 'kakao' 카카오톡 공유 카드, 'any' 휴대폰 공유 창, 'copy' 링크 복사

   <div class="price">${d.p?fmtP(PRICE.more):fmtP(PRICE.first)}<small>${d.p?'추가 검사 가격':'첫 검사 가격'}</small></div>
   <button class="btn" data-join>검사 시작하기</button>
   <p class="small muted">다 마치면 결과를 ${esc(d.f||'가족')}에게 보내는 버튼이 나옵니다.</p></section>`; }
 if(L.kind==='res'){ const d=L.d, r=fullDone(L.ans)? score(L.ans) : null, k=kidByKey(d.k);
  return `<section class="card" style="border-color:var(--accent)"><span class="eyebrow">도착한 검사 결과</span><h1>${esc(ga(d.w||'가족'))} 본 ${esc(d.n||'우리 아이')}</h1>
   ${r?`<div class="type sharecard">${masc(r)}${codeHTML(r)}<h3>${NICK[r.code]}</h3></div>`:`<p class="small muted">아직 다 답하지 않은 결과입니다(${answered(L.ans)}/${ITEMS.length}).</p>`}
   <p class="small muted">${k?`이 휴대폰의 ${esc(kidName(k,0))} 기록에 ${esc(d.w)}의 결과로 합칩니다. 리포트의 '양육자 비교'에서 나란히 볼 수 있습니다.`:`이 휴대폰에 같은 아이가 없어 새 아이로 추가합니다.`}</p>
   <button class="btn" data-merge>${k?'합쳐서 비교 보기':'새 아이로 추가하기'}</button><button class="btn ghost" data-go="home">홈으로</button></section>`; }
 if(L.kind==='type'){ const c=L.code, x=P;
  return `<section class="card type"><span class="eyebrow">친구네 아이의 MBTI</span><img class="masc" src="${TM[c]}" alt="${NICK[c]} 말랑이 캐릭터"><div class="code">${c}</div><h1>${NICK[c]}</h1>
   <p class="muted">${[...c].map(l=>x[l].ph).join(', ')}입니다.</p></section>
   <section class="cta"><h2>우리 아이는 어떤 네 글자일까요?</h2><p class="muted">만 2~7세, 부모가 답하는 66문항 기질검사. 첫 검사 ${fmtP(PRICE.first)}.</p>${appCTA()}</section>`; }
 return `<div class="hero" role="img" aria-label="엄마 말랑이와 아이 말랑이가 마주 보는 색연필 그림"><span>오늘도 말랑하게, 우리 아이 이야기</span></div>
  <section class="cta"><h2>우리 아이의 MBTI는 무엇일까요?</h2><p class="muted">친구가 추천한 영유아 기질검사입니다. 부모가 답하는 66문항, 첫 검사 ${fmtP(PRICE.first)}.</p>${appCTA()}</section>`; };
function joinInvite(){ const d=land&&land.d; if(!d) return; const w=invRole||d.w||'아빠';
  const k=kidByKey(d.k);
  if(k){ setKid(k.id); }
  else if(kids().length===1&&!st.name&&!answered(st.ans)&&!(st.buys||[]).length){ Object.assign(st,blankKid(),{key:d.k}); }
  else addKid({key:d.k});
  if(d.n&&!st.name) st.name=d.n; if(d.a&&!st.age) st.age=d.a; if(d.p) st.ext={o:d.o||'',from:d.f||''}; st.inv={from:d.f||'',at:Date.now()};
  setWho(w); save(); land=null; go('full'); }
function mergeResult(){ const d=land&&land.d; if(!d) return; const k=kidByKey(d.k);
  if(k) setKid(k.id); else addKid({key:d.k,name:d.n||'',age:d.a||'',who:st.who});
  st.cgs=st.cgs||{}; let w=d.w||'가족'; const rec={ans:land.ans,date:d.d||today(),qd:1,prev:null,paid:1,recv:1};
  if(w===st.who){ if(!answered(st.ans)&&!st.prev) Object.assign(st,{ans:rec.ans,date:rec.date,qd:1,paid:1}); else st.cgs[w+'(받은 결과)']=rec; }
  else { st.cgs[w]=rec; if(!answered(st.ans)&&!st.prev) setWho(w); } // 이 휴대폰에서 아직 답하지 않았으면 받은 결과를 바로 보여 준다
  save(); land=null; rtab='cg'; view='report'; history.replaceState(null,'','#report'); render(); }

/* ---------- 기록 옮기기(백업 파일) ---------- */
// 서버가 없어 기록은 이 휴대폰에만 있다. 앱을 지우거나 휴대폰을 바꾸기 전에 파일로 저장해 두고, 새 휴대폰에서 불러온다.
function backup(){ const blob=new Blob([JSON.stringify({app:'aigyeol',v:1,at:Date.now(),st})],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='내아이의MBTI_기록_'+today().replace(/\./g,'')+'.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast('기록 파일을 저장했습니다. 새 휴대폰에서 불러오면 그대로 이어집니다.'); }
function restore(f){ const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.app!=='aigyeol'||!d.st||!d.st.ans) throw 0; st=d.st; save(); location.hash='home'; location.reload(); }catch(e){ toast('이 파일은 불러올 수 없습니다.'); } }; r.readAsText(f); }

/* ---------- 라우팅과 이벤트 ---------- */
let view='home';
function render(){
  const app=$('#app'); app.innerHTML=(V[view]||V.home)(); document.body.dataset.view=view;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===view));
  window.scrollTo(0,0);
}
function go(v){ if(v==='full'){ grab();
    if(!st.paid){ payFor='test'; view='pay'; return render(); }
    if(done(ITEMS)) return go('report');
    startTest(v); view='test'; render(); return; }
  if(v==='report') rtab='temp';
  if(location.hash==='#'+v){ view=v; render(); } else location.hash=v; }
function grab(){ const n=$('#in-name'); if(n){ st.name=n.value.trim(); st.age=$('#in-age').value; setWho($('#in-who').value); save(); } }
// 샘플 답 만들기. base: 축마다 중심 답(1~5), 자라는 힘은 g
function genAns(list,base,g,into){ const seed=[4,5,2,4,3,5,2,4,1,5,4,2,5,3]; let k=0; const o=into||{};
  list.forEach(it=>{ const b=it.ax?base[it.ax]:g; let a=b+(seed[k++%seed.length]>3?0:(k%2?1:-1)); a=Math.max(1,Math.min(5,a)); o[it.id]= it.r? 6-a : a; }); return o; }
// 샘플 리포트: 결제 없이 지금 고른 아이·양육자의 답을 샘플 답으로 덮어쓴다(결제 기록은 남기지 않음)
function sample(){ grab();
  genAns(ITEMS,{A:2,B:4,C:2,D:4},4,st.ans);
  if(!st.name) st.name='콩이'; if(!st.age) st.age='만 5세'; st.qd=1; st.date=today(); st.paid=1;
  if(!st.prev){ // 비교 화면 확인용 샘플 이전 기록(두 달 전): 리듬·자유 축이 자유 쪽이었고(유형 코드 다름), 끈기는 한 칸씩 낮게(→ 자랐음), 함께 힘은 '잘 모르겠다' 4개(→ 비교 제외)
    const pa=genAns(ITEMS.filter(x=>x.ax==='D'),{D:2},0,{...st.ans});
    ITEMS.filter(x=>x.gr==='G1').forEach(x=>{ pa[x.id]= x.r? Math.min(5,pa[x.id]+1) : Math.max(1,pa[x.id]-1); });
    ITEMS.filter(x=>x.gr==='G3').slice(0,4).forEach(x=>{ pa[x.id]=0; });
    const s=snapshot(pa,today(-60),st.who); s.sample=1; st.prev=s; }
  if(!cgs().some(c=>!c.active&&fullDone(c.ans))){ // 양육자 비교 확인용 샘플 다른 양육자: 탐험 쪽으로, 리듬·자유는 가운데쯤으로 본 사람
    st.cgs=st.cgs||{}; const other=CGL.find(n=>n!==st.who&&!hasAns(st.cgs[n]));
    if(other) st.cgs[other]={ans:genAns(ITEMS,{A:4,B:4,C:2,D:3},3),date:today(),qd:1,prev:null,paid:1,sample:1}; }
  save(); go('report'); }
const today=(dd=0)=>{ const d=new Date(Date.now()+dd*864e5); return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0'); };
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.rtab) return setRtab(b.dataset.rtab);
  if(b.dataset.cg){ setWho(b.dataset.cg); return render(); }
  if(b.dataset.addcg){ setWho(b.dataset.addcg); return go('full'); }
  if(b.dataset.kid){ grab(); setKid(b.dataset.kid); return render(); }
  if(b.dataset.addkid!=null){ grab(); addKid(); view='home'; render(); const n=$('#in-name'); if(n) n.focus(); return; }
  if(b.dataset.backup!=null) return backup();
  if(b.dataset.share) return doShare(b.dataset.share,b.dataset.via);
  if(b.dataset.invrole){ invRole=b.dataset.invrole; return render(); }
  if(b.dataset.join!=null) return joinInvite();
  if(b.dataset.merge!=null) return mergeResult();
  if(b.dataset.go) return go(b.dataset.go);
  if(b.dataset.sample) return sample();
  if(b.dataset.buy!=null){ buy(); startTest('full'); view='test'; return render(); }
  if(b.dataset.retest!=null){ if(done(ITEMS)&&st.paid){ payFor='retest'; view='pay'; render(); } return; }
  if(b.dataset.reset!=null){ st.ans={}; st.qd=0; st.paid=0; st.buys=[]; st.ext=0; st.inv=null; st.prev=null; st.cgs={}; save(); return go('home'); }
  if(b.dataset.back!=null){ if(tq.i>0){ tq.i--; render(); } return; }
  if(b.dataset.a){ const cur=tq.list[tq.i]; st.ans[cur.id]=+b.dataset.a; st.date=today();
    save();
    if(tq.i<tq.list.length-1){ tq.i++; render(); } else go('report'); }
});
function route(){ const h=location.hash.slice(1); view= V[h]&&!['test','pay','land'].includes(h)? h : h==='land'&&land? 'land' : 'home'; if(view==='report') rtab='temp'; render(); }
document.addEventListener('submit',e=>e.preventDefault());
// 홈의 '답하는 사람'을 바꾸면 그 양육자의 기록으로 바꿔 끼운다
document.addEventListener('change',e=>{ if(e.target.id==='in-who'){ grab(); render(); } if(e.target.id==='in-restore'&&e.target.files[0]) restore(e.target.files[0]); });
window.addEventListener('hashchange',()=>{ readLanding(); route(); });
readLanding();
if(SHARE.kakaoKey) kakaoReady(); // 버튼을 누른 순간 바로 열리도록 미리 불러 둔다
route();
</script>
