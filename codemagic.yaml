# Codemagic: 내 아이의 MBTI iOS 빌드 → App Store Connect(TestFlight). 설명은 docs/systems/ios-release.md
# Flutter 프로젝트는 저장소의 app/ 폴더에 있다. 비밀값은 이 파일에 없다(Integrations 의 API 키 'Codemagic' 로 서명·업로드).
# 저장소 푸시로 자동 시작하지 않는다. Codemagic 화면의 Start new build 로 직접 시작한다.

workflows:
  ios-testflight:
    name: 내 아이의 MBTI iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: app
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: kr.co.wonderwheel.childmbti
      flutter: 3.41.2
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          # SPM 켜기: Firebase iOS SDK 새 버전이 CocoaPods 에 없다(2026-10~). AdMob(google_mobile_ads)도 SPM 지원.
          flutter config --enable-swift-package-manager
          flutter pub get
      - name: Podfile iOS 15 (Firebase 최소 버전)
        script: |
          flutter build ios --config-only --release --no-codesign
          if [ -f ios/Podfile ]; then
            sed -i '' "s/^# platform :ios.*/platform :ios, '15.0'/" ios/Podfile
            grep "^platform" ios/Podfile
            cd ios && pod install --repo-update
          fi
      - name: Build iOS
        script: |
          # 빌드 번호는 Codemagic 의 단조 증가 값. 표시 버전은 pubspec 의 + 앞부분.
          flutter build ipa --release \
            --build-name=$(grep "^version:" pubspec.yaml | sed 's/version: //' | cut -d'+' -f1) \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # TestFlight 에 올리기까지만 한다. 외부 테스터 배포와 심사 제출은 따로.
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - contact@wonderwheel.co.kr
        notify:
          success: true
          failure: true
